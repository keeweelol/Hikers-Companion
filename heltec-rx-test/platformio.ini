; Hiker's Companion — LoRa RX bench test on Heltec WiFi LoRa 32 V3
;
; Throwaway test rig, not part of the product firmware. Only purpose is to
; confirm the T-Beam Supreme's LoRa TX is actually reaching a second radio
; (same SX1262 chip, different pinout, so the T-Beam code isn't reusable
; as-is).

[env:heltec_wifi_lora_32_V3]
platform = espressif32@6.12.0
framework = arduino
board = heltec_wifi_lora_32_V3

; No ARDUINO_USB_CDC_ON_BOOT here (unlike the T-Beam Supreme's config): this
; board's USB-serial goes through a CP210x UART bridge chip, not the ESP32-S3's
; native USB peripheral, so Serial must stay on UART0 (the default).
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -I ../shared

lib_deps =
    jgromes/RadioLib@^7.1.2
    adafruit/Adafruit SSD1306@^2.5.13

upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    default
    esp32_exception_decoder
