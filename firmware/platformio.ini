; Hiker's Companion firmware — LILYGO T-Beam Supreme (ESP32-S3 + SX1262 + GPS)
;
; Custom firmware, not Meshtastic. Board definition copied from LilyGO's
; LoRa-Series repo (../Lora Source/boards/t-beams3-supreme.json) since it
; isn't in PlatformIO's default board registry.

[platformio]
default_envs = t-beam-supreme

[env:t-beam-supreme]
platform = espressif32@6.12.0
framework = arduino
board = t-beams3-supreme
board_build.partitions = huge_app.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -I ../shared

lib_deps =
    jgromes/RadioLib@^7.1.2
    mikalhart/TinyGPSPlus@^1.0.2
    lewisxhe/XPowersLib@^0.2.6
    adafruit/Adafruit SH110X@^2.1.11
    h2zero/NimBLE-Arduino@^1.4.3

upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    default
    time
    esp32_exception_decoder

; Bench-debug build: skips ESP32 light sleep so USB serial stays alive and a
; monitor can watch every send/ACK live. Higher power draw -- not for battery
; testing. Flash with: pio run -e t-beam-supreme-debug -t upload
[env:t-beam-supreme-debug]
extends = env:t-beam-supreme
build_flags =
    ${env:t-beam-supreme.build_flags}
    -DDEBUG_NO_SLEEP

; One debug env per spreading factor, so switching is just:
;   pio run -e t-beam-supreme-debug-sf9 -t upload
; The Heltec receiver must be flashed to the same SF (heltec-rx-test envs).
[env:t-beam-supreme-debug-sf7]
extends = env:t-beam-supreme-debug
build_flags =
    ${env:t-beam-supreme-debug.build_flags}
    -DLORA_SF=7

[env:t-beam-supreme-debug-sf8]
extends = env:t-beam-supreme-debug
build_flags =
    ${env:t-beam-supreme-debug.build_flags}
    -DLORA_SF=8

[env:t-beam-supreme-debug-sf9]
extends = env:t-beam-supreme-debug
build_flags =
    ${env:t-beam-supreme-debug.build_flags}
    -DLORA_SF=9

[env:t-beam-supreme-debug-sf10]
extends = env:t-beam-supreme-debug
build_flags =
    ${env:t-beam-supreme-debug.build_flags}
    -DLORA_SF=10

; The pre-500 kHz radio settings (SF10 at 125 kHz), for range comparison only.
; Not FCC-compliant on a fixed channel. Pair with heltec-sf10-bw125.
[env:t-beam-supreme-debug-sf10-bw125]
extends = env:t-beam-supreme-debug
build_flags =
    ${env:t-beam-supreme-debug.build_flags}
    -DLORA_SF=10
    -DLORA_BW=125.0

; Concurrent-transmission (contention) test. Both transmitters use the no-sleep
; debug build at SF10, 10 dBm, with a 5s send interval; they differ only in node ID.
; Pair with heltec-contention on the receiver. Flash with:
;   pio run -e contention-tx1 -t upload
[env:contention-tx1]
extends = env:t-beam-supreme-debug
build_flags =
    ${env:t-beam-supreme-debug.build_flags}
    -DLORA_SF=10
    -DLORA_TX_POWER=10
    -DSEND_INTERVAL=5000
    -DNODE_ID=1

[env:contention-tx2]
extends = env:t-beam-supreme-debug
build_flags =
    ${env:t-beam-supreme-debug.build_flags}
    -DLORA_SF=10
    -DLORA_TX_POWER=10
    -DSEND_INTERVAL=5000
    -DNODE_ID=2
