; Hiker's Companion firmware — LILYGO T-Beam Supreme (ESP32-S3 + SX1262 + GPS)
;
; Custom firmware, not Meshtastic. Board definition copied from LilyGO's
; LoRa-Series repo (../Lora Source/boards/t-beams3-supreme.json) since it
; isn't in PlatformIO's default board registry.

[platformio]
default_envs = t-beam-supreme

[env:t-beam-supreme]
platform = espressif32@6.12.0
framework = arduino
board = t-beams3-supreme
board_build.partitions = huge_app.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -I ../shared

lib_deps =
    jgromes/RadioLib@^7.1.2
    mikalhart/TinyGPSPlus@^1.0.2
    lewisxhe/XPowersLib@^0.2.6
    adafruit/Adafruit SH110X@^2.1.11
    h2zero/NimBLE-Arduino@^1.4.3

upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    default
    esp32_exception_decoder

; Bench-debug build: skips ESP32 light sleep so USB serial stays alive and a
; monitor can watch every send/ACK live. Higher power draw -- not for battery
; testing. Flash with: pio run -e t-beam-supreme-debug -t upload
[env:t-beam-supreme-debug]
extends = env:t-beam-supreme
build_flags =
    ${env:t-beam-supreme.build_flags}
    -DDEBUG_NO_SLEEP
