; Hiker's Companion firmware — LILYGO T-Beam Supreme (ESP32-S3 + SX1262 + GPS)
;
; Custom firmware, not Meshtastic. Board definition copied from LilyGO's
; LoRa-Series repo (../Lora Source/boards/t-beams3-supreme.json) since it
; isn't in PlatformIO's default board registry.

[env:t-beam-supreme]
platform = espressif32@6.12.0
framework = arduino
board = t-beams3-supreme
board_build.partitions = huge_app.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -I ../shared

lib_deps =
    jgromes/RadioLib@^7.1.2
    mikalhart/TinyGPSPlus@^1.0.2
    lewisxhe/XPowersLib@^0.2.6
    adafruit/Adafruit SH110X@^2.1.11

upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    default
    esp32_exception_decoder
